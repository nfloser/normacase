spring:
  application:
    name: normacase
  datasource:
    url: ${NORMACASE_DB_URL:jdbc:postgresql://localhost:5432/normacase}
    username: ${NORMACASE_DB_USER:normacase}
    password: ${NORMACASE_DB_PASSWORD:normacase}
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Schlüssel werden intern geholt, der Aussteller muss trotzdem exakt passen.
          issuer-uri: ${NORMACASE_OIDC_ISSUER:http://localhost:8081/realms/normacase}
          jwk-set-uri: ${NORMACASE_OIDC_JWKS:http://localhost:8081/realms/normacase/protocol/openid-connect/certs}
          audiences: normacase-api
          authorities-claim-name: roles
          authority-prefix: ROLE_
          principal-claim-name: preferred_username
  mvc:
    problemdetails:
      enabled: true

normacase:
  knowledge:
    # Regelwerke werden getrennt von der Plattform ausgeliefert (PLATFORM != DOMAIN KNOWLEDGE).
    directory: ${NORMACASE_KNOWLEDGE_DIR:../knowledge}

server:
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true
