name: Synthetic preview bundles

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Self-contained preview (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test preview integrity handling
        run: python scripts/test_preview_integrity.py
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Publish and archive native executables
        run: python scripts/build_preview.py --rid ${{ matrix.rid }} --commit ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exercise extracted preview without shared runtime lookup
        run: python scripts/check_preview.py --archive artifacts/normacase-synthetic-preview-${{ matrix.rid }}.zip --rid ${{ matrix.rid }} --commit ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-preview-${{ matrix.rid }}
          path: artifacts/*
          compression-level: 0
          retention-days: 14
