name: Temporary public-source hash

on:
  push:
    branches:
      - research/pflege-scoring-2026

jobs:
  hash-official-pflege-guideline:
    runs-on: ubuntu-latest
    steps:
      - name: Download official guideline and print SHA-256
        shell: bash
        run: |
          set -euo pipefail
          url="https://md-bund.de/fileadmin/dokumente/Publikationen/SPV/Begutachtungsgrundlagen/BRi_Pflege_26_08_2026.pdf"
          target="/tmp/BRi_Pflege_26_08_2026.pdf"
          curl --fail --location --silent --show-error --retry 3 --output "$target" "$url"
          test "$(head -c 4 "$target")" = "%PDF"
          stat --printf='bytes=%s\n' "$target"
          sha256sum "$target"
