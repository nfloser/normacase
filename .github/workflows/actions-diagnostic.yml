name: Actions runner diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/actions-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-only:
    name: Runner only (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Confirm runner shell starts
        run: echo "runner-started"

  checkout:
    name: Checkout action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Confirm checkout
        run: git rev-parse --verify HEAD

  setup-dotnet:
    name: Setup .NET action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Confirm SDK
        run: dotnet --version
