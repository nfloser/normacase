name: Temporary transport source hash

on:
  push:
    branches:
      - research/krankentransport-2025

jobs:
  hash-official-kt-rl:
    runs-on: ubuntu-latest
    steps:
      - name: Download official KT-RL and print SHA-256
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.g-ba.de/downloads/62-492-3867/KT-RL_2025-05-15_iK-2025-08-06.pdf"
          target="/tmp/KT-RL_2025-05-15_iK-2025-08-06.pdf"
          curl --fail --location --silent --show-error --retry 3 --output "$target" "$url"
          test "$(head -c 4 "$target")" = "%PDF"
          stat --printf='bytes=%s\n' "$target"
          sha256sum "$target"
