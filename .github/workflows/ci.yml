name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check documentation links
        run: python scripts/check_docs.py
      - name: Legacy reference stays unchanged
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git ls-tree -d --name-only "origin/${{ github.base_ref }}" | grep -qx legacy; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD -- legacy | head -n 20)
            if [ -n "$changed" ]; then echo "legacy/ is frozen:"; echo "$changed"; exit 1; fi
          fi

  parity:
    # Der eingefrorene .NET-Kern dient als Orakel für die Java-Regel-Engine (ADR 0005).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Knowledge Packs match the reference
        run: python scripts/check_knowledge_copy.py
      - name: Evaluate every synthetic case with the reference
        run: |
          python scripts/parity/legacy_oracle.py > "$RUNNER_TEMP/cases.json"
          dotnet run --project scripts/parity/oracle -c Release -- "$RUNNER_TEMP/cases.json" "$RUNNER_TEMP/parity"
          cp "$RUNNER_TEMP/cases.json" "$RUNNER_TEMP/parity/cases.json"
      - uses: actions/upload-artifact@v4
        with:
          name: parity-golden
          path: ${{ runner.temp }}/parity
      - name: Committed expectations are current
        run: |
          if ! diff -r "$RUNNER_TEMP/parity" backend/src/test/resources/parity; then
            echo "Erwartungen veraltet. Aktueller Stand als tar.gz (base64) zwischen den Markern:"
            echo "-----BEGIN PARITY-----"
            tar czf - -C "$RUNNER_TEMP" parity | base64
            echo "-----END PARITY-----"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Module documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-docs
          path: backend/target/spring-modulith-docs
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npx ng build
      - name: No external runtime sources
        run: "! grep -rIlE 'https?://(fonts\\.|cdn|unpkg|jsdelivr)' dist/"

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up --build --wait --wait-timeout 300
      - name: Smoke test through the frontend proxy
        run: |
          curl -fsS http://127.0.0.1:4200/ | grep -q '<app-root'
          curl -fsSI http://127.0.0.1:4200/ | grep -qi "content-security-policy: default-src 'self'"
          curl -fsS http://127.0.0.1:4200/api/v1/system | grep -q '"retentionMode":"zero-retention"'
          curl -fsS http://127.0.0.1:4200/config.json | grep -q '"clientId":"normacase-workbench"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4200/api/v1/me)
          test "$code" = 401
          token=$(curl -fsS -d grant_type=client_credentials -d client_id=normacase-host -d client_secret=synthetic-host-secret \
            http://localhost:8081/realms/normacase/protocol/openid-connect/token | jq -r .access_token)
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:4200/api/v1/me | tee /dev/stderr | jq -e '.roles | index("integration")'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://127.0.0.1:4200/api/v1/gibt-es-nicht)
          test "$code" = 404
          jq -n --slurpfile c legacy/examples/cases/demo-a-supported.json \
            '{knowledgeRelease: "demo-a-2026.1", externalReference: {system: "ci", caseId: "SMOKE-1"}, case: $c[0]}' \
            | curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @- \
              http://127.0.0.1:4200/api/v1/assessments | jq -e '.document.assessment.outcome == "SUPPORTED"' 
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser test against the stack
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
