name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    name: Domain build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/NormaCase.Domain.Tests/NormaCase.Domain.Tests.csproj

      - name: Build
        run: dotnet build tests/NormaCase.Domain.Tests/NormaCase.Domain.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/NormaCase.Domain.Tests/NormaCase.Domain.Tests.csproj --configuration Release --no-build

  rule-engine:
    name: Synthetic knowledge slice
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/NormaCase.RuleEngine.Tests/NormaCase.RuleEngine.Tests.csproj

      - name: Build
        run: dotnet build tests/NormaCase.RuleEngine.Tests/NormaCase.RuleEngine.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/NormaCase.RuleEngine.Tests/NormaCase.RuleEngine.Tests.csproj --configuration Release --no-build

  serialization:
    name: Assessment JSON roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Serialization.Tests/NormaCase.Serialization.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Serialization.Tests/NormaCase.Serialization.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Serialization.Tests/NormaCase.Serialization.Tests.csproj --configuration Release --no-build

  offline-evaluator:
    name: Offline evaluator integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Cli.Tests/NormaCase.Cli.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Cli.Tests/NormaCase.Cli.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Cli.Tests/NormaCase.Cli.Tests.csproj --configuration Release --no-build
      - name: Run executable against synthetic example
        run: dotnet run --project src/NormaCase.Cli --configuration Release --no-build -- evaluate --pack knowledge/demo-c/pack.json --case examples/cases/demo-c-supported.json --platform-version ci

      - name: Verify real snapshot capture and replay
        run: python scripts/smoke_snapshot_cli.py

  local-api:
    name: Local HTTP adapter integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Api.Tests/NormaCase.Api.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Api.Tests/NormaCase.Api.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Api.Tests/NormaCase.Api.Tests.csproj --configuration Release --no-build
      - name: Run actual local HTTP executable
        run: python scripts/smoke_local_api.py

  workbench:
    name: German workbench integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: normacase_browser
          POSTGRES_USER: normacase_browser
          POSTGRES_PASSWORD: synthetic-browser-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U normacase_browser -d normacase_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NORMACASE_REVIEW_E2E_CONNECTION: Host=127.0.0.1;Port=5432;Database=normacase_browser;Username=normacase_browser;Password=synthetic-browser-password;Pooling=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: dotnet build src/NormaCase.Api --configuration Release
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run test:e2e:review
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: workbench-browser-results
          path: frontend/test-results
          retention-days: 7

  application:
    name: Assessment record application tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Application.Tests/NormaCase.Application.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Application.Tests/NormaCase.Application.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Application.Tests/NormaCase.Application.Tests.csproj --configuration Release --no-build


  replay:
    name: Portable snapshot replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/NormaCase.Replay.Tests --configuration Release


  postgres-persistence:
    name: Immutable PostgreSQL assessment storage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: normacase_test
          POSTGRES_USER: normacase_test
          POSTGRES_PASSWORD: synthetic-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U normacase_test -d normacase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NORMACASE_POSTGRES_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=normacase_test;Username=normacase_test;Password=synthetic-test-password;Pooling=true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Persistence.PostgreSql.Tests/NormaCase.Persistence.PostgreSql.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Persistence.PostgreSql.Tests/NormaCase.Persistence.PostgreSql.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Persistence.PostgreSql.Tests/NormaCase.Persistence.PostgreSql.Tests.csproj --configuration Release --no-build
      - name: Persistent synthetic review API
        run: dotnet test tests/NormaCase.Api.Tests/NormaCase.Api.Tests.csproj --configuration Release --filter FullyQualifiedName~SyntheticReviewHostTests
      - name: Authenticated synthetic Knowledge governance API
        run: dotnet test tests/NormaCase.Api.Tests/NormaCase.Api.Tests.csproj --configuration Release --filter FullyQualifiedName~SyntheticKnowledgeGovernanceTests

      - name: Create clean synthetic rehearsal databases
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U normacase_test normacase_roundtrip
          docker exec "$POSTGRES_CONTAINER" createdb -U normacase_test normacase_restored
          docker exec "$POSTGRES_CONTAINER" createdb -U normacase_test normacase_least_privilege
      - name: Provision and exercise separate least-privilege database roles
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          NORMACASE_DEMO_DB_MIGRATION_PASSWORD: synthetic-migration-password
          NORMACASE_DEMO_DB_RUNTIME_PASSWORD: synthetic-runtime-password
          NORMACASE_POSTGRES_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=normacase_least_privilege;Username=normacase_runtime;Password=synthetic-runtime-password;Pooling=true
          NORMACASE_POSTGRES_MIGRATION_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=normacase_least_privilege;Username=normacase_migrator;Password=synthetic-migration-password;Pooling=true
        run: |
          docker exec -i \
            -e NORMACASE_DEMO_DB_MIGRATION_PASSWORD \
            -e NORMACASE_DEMO_DB_RUNTIME_PASSWORD \
            "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U normacase_test -d normacase_least_privilege \
            < ops/postgresql/provision-least-privilege.sql
          python scripts/smoke_synthetic_roundtrip.py create /tmp/normacase-least-privilege.json
          if docker exec -e PGPASSWORD=synthetic-runtime-password "$POSTGRES_CONTAINER" \
            psql -v ON_ERROR_STOP=1 -U normacase_runtime -d normacase_least_privilege \
            -c 'CREATE TABLE normacase.runtime_must_not_create(id integer)'; then
            echo "Restricted runtime role unexpectedly created a table" >&2
            exit 1
          fi
          if docker exec -e PGPASSWORD=synthetic-runtime-password "$POSTGRES_CONTAINER" \
            psql -v ON_ERROR_STOP=1 -U normacase_runtime -d normacase_least_privilege \
            -c 'DELETE FROM normacase.case_review_versions WHERE false'; then
            echo "Restricted runtime role unexpectedly deleted rows" >&2
            exit 1
          fi
          docker exec -i \
            -e NORMACASE_DEMO_DB_MIGRATION_PASSWORD \
            -e NORMACASE_DEMO_DB_RUNTIME_PASSWORD \
            "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U normacase_test -d normacase_least_privilege \
            < ops/postgresql/provision-least-privilege.sql
          python scripts/smoke_synthetic_roundtrip.py verify /tmp/normacase-least-privilege.json
      - name: Clean install and exact restart replay
        env:
          NORMACASE_POSTGRES_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=normacase_roundtrip;Username=normacase_test;Password=synthetic-test-password;Pooling=true
        run: |
          python scripts/smoke_synthetic_roundtrip.py create /tmp/normacase-rehearsal.json
          python scripts/smoke_synthetic_roundtrip.py verify /tmp/normacase-rehearsal.json
      - name: Back up and restore immutable synthetic history to a fresh database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" pg_dump -U normacase_test --format=custom --no-owner --no-acl normacase_roundtrip > /tmp/normacase-rehearsal.dump
          tar -cf /tmp/normacase-outbound.tar -C /tmp/synthetic-outbound .
          mv /tmp/synthetic-outbound /tmp/normacase-outbound-before-restore
          mkdir /tmp/synthetic-outbound
          tar -xf /tmp/normacase-outbound.tar -C /tmp/synthetic-outbound
          docker exec -i "$POSTGRES_CONTAINER" pg_restore -U normacase_test --dbname=normacase_restored --no-owner --no-acl --exit-on-error < /tmp/normacase-rehearsal.dump
      - name: Verify original cases and delivery receipts after restore
        env:
          NORMACASE_POSTGRES_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=normacase_restored;Username=normacase_test;Password=synthetic-test-password;Pooling=true
        run: python scripts/smoke_synthetic_roundtrip.py verify /tmp/normacase-rehearsal.json


  native-update-recovery:
    name: Native installation, update and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: normacase_native
          POSTGRES_USER: normacase_test
          POSTGRES_PASSWORD: synthetic-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U normacase_test -d normacase_native"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NORMACASE_POSTGRES_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=normacase_native;Username=normacase_test;Password=synthetic-test-password;Pooling=true
      PREVIOUS_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate and previous sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Verify staging failures and prepare previous exact package
        run: |
          python scripts/test_installation.py
          git worktree add --detach /tmp/normacase-previous "$PREVIOUS_COMMIT"
          npm ci --prefix /tmp/normacase-previous/frontend
          npm run build --prefix /tmp/normacase-previous/frontend
          python /tmp/normacase-previous/scripts/build_preview.py --rid linux-x64 --commit "$PREVIOUS_COMMIT" --output /tmp/normacase-old-package
      - name: Build candidate native package
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          python scripts/build_preview.py --rid linux-x64 --commit "$CANDIDATE_COMMIT" --output /tmp/normacase-new-package
      - name: Stage both verified packages and activate exact previous release
        run: |
          python scripts/manage_installation.py stage --root /tmp/normacase-installed --archive /tmp/normacase-old-package/normacase-synthetic-preview-linux-x64.zip --rid linux-x64 --commit "$PREVIOUS_COMMIT"
          python scripts/manage_installation.py stage --root /tmp/normacase-installed --archive /tmp/normacase-new-package/normacase-synthetic-preview-linux-x64.zip --rid linux-x64 --commit "$CANDIDATE_COMMIT"
          python scripts/manage_installation.py activate --root /tmp/normacase-installed --commit "$PREVIOUS_COMMIT"
          mkdir /tmp/native-rehearsal
      - name: Install previous native version and retain original exact history
        env:
          NORMACASE_INSTALLATION_TEST_ROOT: /tmp/normacase-installed
          NORMACASE_REFUSED_SWITCH_TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          DOTNET_ROOT: /tmp/absent-shared-dotnet
          DOTNET_ROOT_X64: /tmp/absent-shared-dotnet
          DOTNET_MULTILEVEL_LOOKUP: 0
        run: |
          export NORMACASE_API_TEST_EXECUTABLE="/tmp/normacase-installed/releases/$PREVIOUS_COMMIT/api/NormaCase.Api"
          python scripts/smoke_synthetic_roundtrip.py create /tmp/native-rehearsal/state.json
          cp /tmp/native-rehearsal/state.json /tmp/native-rehearsal/before.json
          python scripts/smoke_synthetic_roundtrip.py verify /tmp/native-rehearsal/state.json
      - name: Preserve pre-update database and files
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" pg_dump -U normacase_test --format=custom --no-owner --no-acl normacase_native > /tmp/native-before.dump
          tar -cf /tmp/native-before-files.tar -C /tmp/native-rehearsal/synthetic-outbound .
      - name: Activate exact candidate and process new revisions under its platform identity
        env:
          NORMACASE_INSTALLATION_TEST_ROOT: /tmp/normacase-installed
          NORMACASE_REFUSED_SWITCH_TEST_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOTNET_ROOT: /tmp/absent-shared-dotnet
          DOTNET_ROOT_X64: /tmp/absent-shared-dotnet
          DOTNET_MULTILEVEL_LOOKUP: 0
        run: |
          python scripts/manage_installation.py activate --root /tmp/normacase-installed --commit "$CANDIDATE_COMMIT"
          export NORMACASE_API_TEST_EXECUTABLE="/tmp/normacase-installed/releases/$CANDIDATE_COMMIT/api/NormaCase.Api"
          export NORMACASE_EXPECTED_PLATFORM_VERSION="0.1.0-preview+$CANDIDATE_COMMIT"
          python scripts/smoke_synthetic_roundtrip.py upgrade /tmp/native-rehearsal/state.json
          python scripts/smoke_synthetic_roundtrip.py verify /tmp/native-rehearsal/state.json
          python scripts/smoke_failed_startup.py "$NORMACASE_API_TEST_EXECUTABLE"
          python scripts/smoke_synthetic_roundtrip.py verify /tmp/native-rehearsal/state.json
      - name: Restore old and updated snapshots into separate fresh databases
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U normacase_test normacase_native_rollback
          docker exec "$POSTGRES_CONTAINER" createdb -U normacase_test normacase_native_restored
          docker exec "$POSTGRES_CONTAINER" pg_dump -U normacase_test --format=custom --no-owner --no-acl normacase_native > /tmp/native-updated.dump
          tar -cf /tmp/native-updated-files.tar -C /tmp/native-rehearsal/synthetic-outbound .
          docker exec -i "$POSTGRES_CONTAINER" pg_restore -U normacase_test --dbname=normacase_native_rollback --no-owner --no-acl --exit-on-error < /tmp/native-before.dump
          docker exec -i "$POSTGRES_CONTAINER" pg_restore -U normacase_test --dbname=normacase_native_restored --no-owner --no-acl --exit-on-error < /tmp/native-updated.dump
          mkdir -p /tmp/native-rollback/synthetic-outbound /tmp/native-restored/synthetic-outbound
          cp /tmp/native-rehearsal/before.json /tmp/native-rollback/state.json
          cp /tmp/native-rehearsal/state.json /tmp/native-restored/state.json
          tar -xf /tmp/native-before-files.tar -C /tmp/native-rollback/synthetic-outbound
          tar -xf /tmp/native-updated-files.tar -C /tmp/native-restored/synthetic-outbound
      - name: Verify previous native release against its own restored snapshot
        env:
          NORMACASE_POSTGRES_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=normacase_native_rollback;Username=normacase_test;Password=synthetic-test-password;Pooling=true
          DOTNET_ROOT: /tmp/absent-shared-dotnet
          DOTNET_ROOT_X64: /tmp/absent-shared-dotnet
          DOTNET_MULTILEVEL_LOOKUP: 0
        run: |
          python scripts/manage_installation.py activate --root /tmp/normacase-installed --commit "$PREVIOUS_COMMIT"
          export NORMACASE_API_TEST_EXECUTABLE="/tmp/normacase-installed/releases/$PREVIOUS_COMMIT/api/NormaCase.Api"
          python scripts/smoke_synthetic_roundtrip.py verify /tmp/native-rollback/state.json
      - name: Verify candidate correction and clarification history after physical restore
        env:
          NORMACASE_POSTGRES_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=normacase_native_restored;Username=normacase_test;Password=synthetic-test-password;Pooling=true
          DOTNET_ROOT: /tmp/absent-shared-dotnet
          DOTNET_ROOT_X64: /tmp/absent-shared-dotnet
          DOTNET_MULTILEVEL_LOOKUP: 0
        run: |
          python scripts/manage_installation.py activate --root /tmp/normacase-installed --commit "$CANDIDATE_COMMIT"
          export NORMACASE_API_TEST_EXECUTABLE="/tmp/normacase-installed/releases/$CANDIDATE_COMMIT/api/NormaCase.Api"
          python scripts/smoke_synthetic_roundtrip.py verify /tmp/native-restored/state.json
