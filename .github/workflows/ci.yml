name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check documentation links
        run: python scripts/check_docs.py
      - name: Legacy reference stays unchanged
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git ls-tree -d --name-only "origin/${{ github.base_ref }}" | grep -qx legacy; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD -- legacy | head -n 20)
            if [ -n "$changed" ]; then echo "legacy/ is frozen:"; echo "$changed"; exit 1; fi
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Module documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-docs
          path: backend/target/spring-modulith-docs
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npx ng build
      - name: No external runtime sources
        run: "! grep -rIlE 'https?://(fonts\\.|cdn|unpkg|jsdelivr)' dist/"

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up --build --wait --wait-timeout 300
      - name: Smoke test through the frontend proxy
        run: |
          curl -fsS http://127.0.0.1:4200/ | grep -q '<app-root'
          curl -fsSI http://127.0.0.1:4200/ | grep -qi "content-security-policy: default-src 'self'"
          curl -fsS http://127.0.0.1:4200/api/v1/system | grep -q '"retentionMode":"zero-retention"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4200/api/v1/gibt-es-nicht)
          test "$code" = 404
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
