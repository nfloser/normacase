name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  domain:
    name: Domain build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/NormaCase.Domain.Tests/NormaCase.Domain.Tests.csproj

      - name: Build
        run: dotnet build tests/NormaCase.Domain.Tests/NormaCase.Domain.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/NormaCase.Domain.Tests/NormaCase.Domain.Tests.csproj --configuration Release --no-build

  rule-engine:
    name: Synthetic knowledge slice
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/NormaCase.RuleEngine.Tests/NormaCase.RuleEngine.Tests.csproj

      - name: Build
        run: dotnet build tests/NormaCase.RuleEngine.Tests/NormaCase.RuleEngine.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/NormaCase.RuleEngine.Tests/NormaCase.RuleEngine.Tests.csproj --configuration Release --no-build

  serialization:
    name: Assessment JSON roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Serialization.Tests/NormaCase.Serialization.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Serialization.Tests/NormaCase.Serialization.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Serialization.Tests/NormaCase.Serialization.Tests.csproj --configuration Release --no-build

  offline-evaluator:
    name: Offline evaluator integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Cli.Tests/NormaCase.Cli.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Cli.Tests/NormaCase.Cli.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Cli.Tests/NormaCase.Cli.Tests.csproj --configuration Release --no-build
      - name: Run executable against synthetic example
        run: dotnet run --project src/NormaCase.Cli --configuration Release --no-build -- evaluate --pack knowledge/demo-c/pack.json --case examples/cases/demo-c-supported.json --platform-version ci

  local-api:
    name: Local HTTP adapter integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Api.Tests/NormaCase.Api.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Api.Tests/NormaCase.Api.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Api.Tests/NormaCase.Api.Tests.csproj --configuration Release --no-build
      - name: Run actual local HTTP executable
        run: python scripts/smoke_local_api.py

  workbench:
    name: German workbench integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: dotnet build src/NormaCase.Api --configuration Release
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workbench-browser-results
          path: frontend/test-results
          retention-days: 7


  assessments:
    name: Assessment provenance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Assessments.Tests/NormaCase.Assessments.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Assessments.Tests/NormaCase.Assessments.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Assessments.Tests/NormaCase.Assessments.Tests.csproj --configuration Release --no-build
