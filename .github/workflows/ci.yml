name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  domain:
    name: Domain build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/NormaCase.Domain.Tests/NormaCase.Domain.Tests.csproj

      - name: Build
        run: dotnet build tests/NormaCase.Domain.Tests/NormaCase.Domain.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/NormaCase.Domain.Tests/NormaCase.Domain.Tests.csproj --configuration Release --no-build

  rule-engine:
    name: Synthetic knowledge slice
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/NormaCase.RuleEngine.Tests/NormaCase.RuleEngine.Tests.csproj

      - name: Build
        run: dotnet build tests/NormaCase.RuleEngine.Tests/NormaCase.RuleEngine.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/NormaCase.RuleEngine.Tests/NormaCase.RuleEngine.Tests.csproj --configuration Release --no-build

  serialization:
    name: Assessment JSON roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Serialization.Tests/NormaCase.Serialization.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Serialization.Tests/NormaCase.Serialization.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Serialization.Tests/NormaCase.Serialization.Tests.csproj --configuration Release --no-build

  offline-evaluator:
    name: Offline evaluator integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Cli.Tests/NormaCase.Cli.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Cli.Tests/NormaCase.Cli.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Cli.Tests/NormaCase.Cli.Tests.csproj --configuration Release --no-build
      - name: Run executable against synthetic example
        run: dotnet run --project src/NormaCase.Cli --configuration Release --no-build -- evaluate --pack knowledge/demo-c/pack.json --case examples/cases/demo-c-supported.json --platform-version ci

      - name: Verify real snapshot capture and replay
        run: python scripts/smoke_snapshot_cli.py

  local-api:
    name: Local HTTP adapter integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Api.Tests/NormaCase.Api.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Api.Tests/NormaCase.Api.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Api.Tests/NormaCase.Api.Tests.csproj --configuration Release --no-build
      - name: Run actual local HTTP executable
        run: python scripts/smoke_local_api.py

  workbench:
    name: German workbench integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: dotnet build src/NormaCase.Api --configuration Release
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workbench-browser-results
          path: frontend/test-results
          retention-days: 7

  application:
    name: Assessment record application tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Application.Tests/NormaCase.Application.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Application.Tests/NormaCase.Application.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Application.Tests/NormaCase.Application.Tests.csproj --configuration Release --no-build


  replay:
    name: Portable snapshot replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/NormaCase.Replay.Tests --configuration Release


  postgres-persistence:
    name: Immutable PostgreSQL assessment storage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: normacase_test
          POSTGRES_USER: normacase_test
          POSTGRES_PASSWORD: synthetic-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U normacase_test -d normacase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NORMACASE_POSTGRES_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=normacase_test;Username=normacase_test;Password=synthetic-test-password;Pooling=true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/NormaCase.Persistence.PostgreSql.Tests/NormaCase.Persistence.PostgreSql.Tests.csproj
      - name: Build
        run: dotnet build tests/NormaCase.Persistence.PostgreSql.Tests/NormaCase.Persistence.PostgreSql.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/NormaCase.Persistence.PostgreSql.Tests/NormaCase.Persistence.PostgreSql.Tests.csproj --configuration Release --no-build

  preview-bundles:
    name: Self-contained preview (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive_ext: tar.gz
          - os: windows-latest
            rid: win-x64
            archive_ext: zip
    env:
      RID: ${{ matrix.rid }}
      ARCHIVE_EXT: ${{ matrix.archive_ext }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Define exact build identity
        shell: bash
        run: |
          echo "PLATFORM_VERSION=preview-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BUNDLE_NAME=normacase-preview-${RID}-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Restore and test frontend
        shell: bash
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run typecheck
      - name: Build German workbench
        shell: bash
        run: npm --prefix frontend run build
      - name: Publish self-contained API
        shell: bash
        run: >-
          dotnet publish src/NormaCase.Api/NormaCase.Api.csproj
          --configuration Release
          --runtime "$RID"
          --self-contained true
          -p:InformationalVersion="$PLATFORM_VERSION"
          -p:IncludeSourceRevisionInInformationalVersion=false
          --output artifacts/publish-api
      - name: Publish self-contained CLI
        shell: bash
        run: >-
          dotnet publish src/NormaCase.Cli/NormaCase.Cli.csproj
          --configuration Release
          --runtime "$RID"
          --self-contained true
          -p:InformationalVersion="$PLATFORM_VERSION"
          -p:IncludeSourceRevisionInInformationalVersion=false
          --output artifacts/publish-cli
      - name: Assemble preview
        shell: bash
        run: >-
          python scripts/package_preview.py
          --rid "$RID"
          --source-commit "$GITHUB_SHA"
          --platform-version "$PLATFORM_VERSION"
          --api-dir artifacts/publish-api
          --cli-dir artifacts/publish-cli
          --repo-root .
          --output-dir "artifacts/$BUNDLE_NAME"
      - name: Archive preview
        id: archive
        shell: bash
        run: |
          ARCHIVE="artifacts/$BUNDLE_NAME.$ARCHIVE_EXT"
          python scripts/archive_preview.py --bundle-dir "artifacts/$BUNDLE_NAME" --archive "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "checksum=$ARCHIVE.sha256" >> "$GITHUB_OUTPUT"
      - name: Smoke-test extracted archive
        shell: bash
        run: python scripts/smoke_preview_bundle.py --archive "${{ steps.archive.outputs.archive }}"
      - name: Upload tested preview
        uses: actions/upload-artifact@v7
        with:
          name: normacase-preview-${{ matrix.rid }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7
