name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check documentation links
        run: python scripts/check_docs.py
      - name: Legacy reference stays unchanged
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git ls-tree -d --name-only "origin/${{ github.base_ref }}" | grep -qx legacy; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD -- legacy | head -n 20)
            if [ -n "$changed" ]; then echo "legacy/ is frozen:"; echo "$changed"; exit 1; fi
          fi

  parity:
    # Der eingefrorene .NET-Kern dient als Orakel für die Java-Regel-Engine (ADR 0005).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Knowledge Packs match the reference
        run: python scripts/check_knowledge_copy.py
      - name: Evaluate every synthetic case with the reference
        run: |
          python scripts/parity/legacy_oracle.py > "$RUNNER_TEMP/cases.json"
          dotnet run --project scripts/parity/oracle -c Release -- "$RUNNER_TEMP/cases.json" "$RUNNER_TEMP/parity"
          cp "$RUNNER_TEMP/cases.json" "$RUNNER_TEMP/parity/cases.json"
      - uses: actions/upload-artifact@v7
        with:
          name: parity-golden
          path: ${{ runner.temp }}/parity
      - name: Committed expectations are current
        run: |
          if ! diff -r "$RUNNER_TEMP/parity" backend/src/test/resources/parity; then
            echo "Erwartungen veraltet. Aktueller Stand als tar.gz (base64) zwischen den Markern:"
            echo "-----BEGIN PARITY-----"
            tar czf - -C "$RUNNER_TEMP" parity | base64
            echo "-----END PARITY-----"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Coverage and SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco
            backend/target/classes/META-INF/sbom
          if-no-files-found: ignore
      - name: Module documentation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-docs
          path: backend/target/spring-modulith-docs
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npx ng build
      - name: SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@4 --omit dev --output-file sbom-frontend.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-frontend
          path: frontend/sbom-frontend.cdx.json
      - name: No external runtime sources
        run: "! grep -rIlE 'https?://(fonts\\.|cdn|unpkg|jsdelivr)' dist/"

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate manifests
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          for overlay in ops/k8s/base ops/k8s/overlays/demo; do
            kubectl kustomize "$overlay" > rendered.yaml
            ./kubeconform -strict -summary -kubernetes-version 1.33.0 rendered.yaml
          done
      - name: Knowledge image builds separately from the platform
        run: docker build -t normacase-knowledge:ci knowledge

  demo-script-windows:
    # Windows PowerShell 5.1 liest Skripte anders (Kodierung, Syntax); das Demo-Skript muss dort fehlerfrei parsen.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse demo.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\demo.ps1), [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path .\demo.ps1))
          if ($bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) { Write-Error 'demo.ps1 braucht UTF-8 mit BOM'; exit 1 }
          $text = Get-Content -Raw -Encoding UTF8 .\demo.ps1
          # Prüfwort ohne Umlaut im Quelltext dieses Schritts: GitHub legt ihn ohne BOM ab.
          if (-not $text.Contains('Pr' + [char]0x00FC + 'fwerkstatt')) { Write-Error 'Umlaute werden falsch gelesen (BOM fehlt?)'; exit 1 }
          Get-Help .\demo.ps1 | Out-String | Write-Host

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack with the demo script
        shell: pwsh
        run: ./demo.ps1 -Reset -NoBrowser
      - name: Smoke test through the frontend proxy
        run: |
          curl -fsS http://127.0.0.1:4200/ | grep -q '<app-root'
          curl -fsSI http://127.0.0.1:4200/ | grep -qi "content-security-policy: default-src 'self'"
          curl -fsS http://127.0.0.1:4200/api/v1/system | grep -q '"retentionMode":"zero-retention"'
          curl -fsS http://127.0.0.1:4200/config.json | grep -q '"clientId":"normacase-workbench"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4200/api/v1/me)
          test "$code" = 401
          token=$(curl -fsS -d grant_type=client_credentials -d client_id=normacase-host -d client_secret=synthetic-host-secret \
            http://localhost:8081/realms/normacase/protocol/openid-connect/token | jq -r .access_token)
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:4200/api/v1/me | tee /dev/stderr | jq -e '.roles | index("integration")'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://127.0.0.1:4200/api/v1/gibt-es-nicht)
          test "$code" = 404
          jq -n --slurpfile c legacy/examples/cases/demo-a-supported.json \
            '{knowledgeRelease: "demo-a-2026.1", externalReference: {system: "ci", caseId: "SMOKE-1"}, case: $c[0]}' \
            | curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @- \
              http://127.0.0.1:4200/api/v1/assessments | jq -e '.document.assessment.outcome == "SUPPORTED"' 
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser test against the stack
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: frontend/screenshots
          if-no-files-found: ignore
      - name: Screenshots im Log (für Doku-Aktualisierung)
        if: contains(github.head_ref, 'showcase')
        run: |
          echo "-----BEGIN SCREENSHOTS-----"
          tar czf - -C frontend screenshots | base64
          echo "-----END SCREENSHOTS-----"
      - name: Load test (k6)
        uses: grafana/setup-k6-action@v1
      - name: Run k6
        run: |
          token=$(curl -fsS -d grant_type=client_credentials -d client_id=normacase-host -d client_secret=synthetic-host-secret \
            http://localhost:8081/realms/normacase/protocol/openid-connect/token | jq -r .access_token)
          k6 run -e TOKEN="$token" -e BASE_URL=http://127.0.0.1:4200 ops/load/assessments.js
      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
      - name: Fehlerkontext der E2E-Tests
        if: failure()
        run: |
          for f in frontend/test-results/*/error-context.md; do [ -f "$f" ] && { echo "== $f"; head -c 20000 "$f"; echo; }; done
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
