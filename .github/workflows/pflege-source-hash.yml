name: Capture Pflege source hash

on:
  pull_request:
    paths:
      - ".github/workflows/pflege-source-hash.yml"
      - "docs/knowledge/research/PFLEGE_2026_SOURCE_ANALYSIS.md"

permissions:
  contents: read

jobs:
  hash-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download official guideline and print provenance
        shell: bash
        run: |
          set -euo pipefail
          url="https://md-bund.de/fileadmin/dokumente/Publikationen/SPV/Begutachtungsgrundlagen/BRi_Pflege_26_08_2026.pdf"
          curl --fail --location --retry 3 --retry-delay 2 --output source.pdf "$url"
          printf 'source_url=%s\n' "$url"
          printf 'size_bytes='
          stat --format='%s' source.pdf
          printf 'sha256='
          sha256sum source.pdf | cut -d' ' -f1
