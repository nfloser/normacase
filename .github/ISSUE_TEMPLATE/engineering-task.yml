name: Engineering task
description: A focused bug, feature, refactor, architecture, security or knowledge task
title: ""
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem or missing capability should this task address?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the intended observable result.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the conditions that make this task complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Technical / domain notes
      description: Relevant architecture, knowledge, security, data or source constraints.

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Explicitly list adjacent work that should not be pulled into this issue.
