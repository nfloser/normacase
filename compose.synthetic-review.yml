# Local synthetic data only. The API remains a separate loopback process.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: normacase_synthetic
      POSTGRES_USER: normacase_synthetic
      POSTGRES_PASSWORD: ${NORMACASE_DEMO_DB_PASSWORD:?Set an external synthetic database password}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - synthetic-review-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normacase_synthetic -d normacase_synthetic"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  synthetic-review-data:
