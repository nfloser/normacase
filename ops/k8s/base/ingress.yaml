apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: normacase
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [normacase.example.invalid]
      secretName: normacase-tls
  rules:
    - host: normacase.example.invalid
      http:
        paths:
          # Nur Oberfläche und /api; Actuator bleibt clusterintern.
          - path: /api/
            pathType: Prefix
            backend: { service: { name: backend, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { name: http } } }
